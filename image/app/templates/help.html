{% extends "base.html" %}
{% block title %}{{ t('title.help_of', module=module_label) }} – Daily Helper{% endblock %}

{% block content %}
<div class="page-header">
  <h1><i data-lucide="help-circle" class="icon-sm"></i> {{ t('title.help_of', module=module_label) }}</h1>
  {% if back_url %}
  <a href="{{ back_url }}" class="btn btn-secondary btn-sm">{{ t("action.back") }}</a>
  {% endif %}
</div>

<div class="entry-content markdown-body" style="max-width:48rem">
  {{ html | safe }}
</div>
{% endblock %}
