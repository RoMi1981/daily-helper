{% extends "base.html" %}
{% block content %}

<div class="page-header">
  <h1><i data-lucide="search" class="icon-sm"></i>{{ t("eol.track_software") }}</h1>
  <a href="/eol" class="btn btn-secondary btn-sm">{{ t("action.back") }}</a>
</div>

<div class="eol-search-wrap">
  <input
    type="search"
    id="eol-search-input"
    class="form-control"
    placeholder="{{ t('ph.eol_search') }}"
    autocomplete="off"
    hx-get="/eol/search"
    hx-trigger="input changed delay:300ms, search"
    hx-target="#eol-search-results"
    name="q"
    value="{{ q or '' }}"
    autofocus
  >
</div>

<div id="eol-search-results" class="eol-search-results">
  {% if results %}
    {% include "modules/eol/_search_results.html" %}
  {% else %}
  <p class="hint" style="margin-top:1rem">{{ t("eol.search_hint") }}</p>
  {% endif %}
</div>

{% endblock %}
