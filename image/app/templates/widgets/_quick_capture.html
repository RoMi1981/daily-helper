<form action="/tasks" method="post" class="widget-qc-form">
  <input type="text" name="title" placeholder="{{ t('widget.qc.new_task') }}" class="form-control" required autocomplete="off">
  <div class="widget-qc-row">
    <input type="date" name="due_date" class="form-control" style="flex:1">
    <select name="priority" class="form-control" style="flex:0 0 auto">
      <option value="medium">{{ t("priority.medium") }}</option>
      <option value="high">{{ t("priority.high") }}</option>
      <option value="low">{{ t("priority.low") }}</option>
    </select>
    <button type="submit" class="btn btn-primary btn-sm">{{ t("action.add") }}</button>
  </div>
</form>
<a href="/tasks/new" class="widget-footer-link">{{ t("widget.footer.full_form") }}</a>
